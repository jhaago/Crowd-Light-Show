name: Build CrowdLight Bridge

on:
  workflow_dispatch:
  push:
    paths:
      - 'CrowdLightBridge/**'
      - '.github/workflows/build-crowdlight-bridge.yml'

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run unit tests
        run: |
          cd CrowdLightBridge
          swift test

      - name: Build macOS app
        run: |
          cd CrowdLightBridge
          bash scripts/build-app.sh

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrowdLight-Bridge-macOS
          path: CrowdLightBridge/dist/CrowdLight-Bridge-macOS.zip
          if-no-files-found: error
